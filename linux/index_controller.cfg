// GZDoomVR on Linux - key bindings for Valve Index controllers
//
// This file assigns game actions to the controller buttons. Edit it to your liking, then
// load it once:
//
//     ./gzdoomvr +exec /full/path/to/linux/index_controller.cfg
//
// or type "exec /full/path/to/linux/index_controller.cfg" in the console. The bindings are
// saved to ~/.config/gzdoomvr/gzdoomvr.ini afterwards, so the file is only needed again
// after you changed it. Everything here can also be set in the game under
// Options -> Customize Controls.
//
// For Brutal Doom there are additional bindings in index_controller_brutaldoom.cfg.
//
// It belongs together with steamvr_bindings/index_legacy.json. That file tells SteamVR
// which physical button arrives as which key name below; select it with
// steamvr_bindings/select_binding.sh. Without it SteamVR reports the A buttons as grip
// and a fully deflected thumbstick as a click.
//
// Key names as they arrive with index_legacy.json:
//
//   right hand                          left hand
//   RTrigger    trigger                 LTrigger    trigger
//   Pad_A       B button                Pad_X       A button
//   Pad_B       A button                Pad_Y       B button
//   RShoulder   grip (squeeze)          LShoulder   grip (squeeze)
//   RThumb      thumbstick click        LThumb      thumbstick click
//   DPadUp      trackpad, upper half    DPadLeft    trackpad, upper half
//   DPadDown    trackpad, lower half    DPadRight   trackpad, lower half
//   Pad_Start   system button (SteamVR may keep it for its dashboard)
//   RStickLeft/Right/Up/Down            LStickLeft/Right/Up/Down
//               thumbstick pushed to the edge, in addition to the analog axes
//
// "right" and "left" assume a right-handed setup (openvr_rightHanded true). With a
// left-handed setup the weapon hand is the left one and the names swap sides.
//
// In menus the keys are fixed: Pad_A and the weapon hand trigger confirm, Pad_B goes
// back, both thumbsticks navigate.

// The weapon hand grip is a button of its own. With "true" it works as a shift key for
// a second set of bindings (Pad_A_Alt, RTrigger_Alt, ...) and RShoulder is never sent.
vr_alternate_mappings false

// Right hand
bind RTrigger   +attack
bind Pad_A      +use
unbind Pad_B
bind RShoulder  +jump
unbind RThumb
bind DPadUp     weapnext
bind DPadDown   weapprev
unbind RStickUp
unbind RStickDown

// Left hand
bind LTrigger   +altattack
bind LShoulder  +crouch
bind LThumb     "toggle cl_run"   // thumbstick click switches always-run on and off
bind Pad_X      menu_main
bind Pad_Y      togglemap
unbind DPadLeft
unbind DPadRight

// Turning: false = smooth, true = in steps of vr_snap_angle degrees
vr_snap_turn false

// Desktop window: 0 = both eyes side by side, 1 = left eye only, filling the window
openvr_desktop_view 1

// The thumbstick axes (move, strafe, turn, dead zones, sensitivity) cannot be set from a
// script. Use Options -> Controller Options -> OpenVR in the game. Defaults: left stick
// moves and strafes, right stick turns left/right and moves up/down (swimming, flying).
