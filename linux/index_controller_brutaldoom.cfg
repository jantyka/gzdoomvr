// GZDoomVR on Linux - additional key bindings for Brutal Doom with Valve Index controllers
//
// Load this on top of index_controller.cfg when you play Brutal Doom:
//
//     ./gzdoomvr -file /path/to/brutalv21.pk3 +exec /full/path/to/linux/index_controller.cfg \
//         +exec /full/path/to/linux/index_controller_brutaldoom.cfg
//
// The commands below (kickem, reload, dual, grenadetoss, ...) are defined by Brutal Doom
// itself and only exist while the mod is loaded. The bindings stay in gzdoomvr.ini; to get
// the plain layout back, load index_controller.cfg again.
//
// Written for Brutal Doom v21. See index_controller.cfg for the key names.

// Right thumbstick pushed forward / pulled back. For this the vertical axis of the right
// stick should not move the player: set it to "None" under Options -> Controller Options
// -> OpenVR, otherwise it also moves up and down while swimming or flying.
bind RStickUp    kickem
bind RStickDown  reload

// Left hand
bind LTrigger    dual          // "Dual Wield/Special Action"; replaces +altattack
bind DPadLeft    brutaltaunt   // "Offend", on both halves of the left trackpad
bind DPadRight   brutaltaunt

// Right hand
bind RThumb      grenadetoss   // thumbstick click

// More Brutal Doom commands you can bind to a free key such as Pad_B (right A button),
// Pad_X or Pad_Y (left A and B):
//   +altattack           alternate fire / aim, no longer on a key with the bindings above
//   flashlightswitch     flashlight
//   unreloader           unload the weapon
//   quickpistol          quick pull pistol
//   invuse               use inventory item
