// GZDoomVR on Linux - additional key bindings for Brutal Doom 64 with Valve Index controllers
//
// Load this on top of index_controller.cfg when you play Brutal Doom 64:
//
//     ./gzdoomvr -iwad /path/to/DOOM2.WAD -file /path/to/bd64gamev2.pk3 /path/to/bd64mapsV2.pk3 \
//         +exec /full/path/to/linux/index_controller.cfg \
//         +exec /full/path/to/linux/index_controller_brutaldoom64.cfg
//
// Brutal Doom 64 defines only two commands of its own, kickem and reloader. They exist
// only while the mod is loaded. The bindings stay in gzdoomvr.ini; to get the plain layout
// back, load index_controller.cfg again.
//
// Written for Brutal Doom 64 v2. See index_controller.cfg for the key names and for why
// the lines start with "wait". It is "wait 3" here so that these bindings come after the
// regular ones.

// Right thumbstick pushed forward / pulled back. For this the vertical axis of the right
// stick should not move the player: set it to "None" under Options -> Controller Options
// -> OpenVR, otherwise it also moves up and down while swimming or flying.
wait 3; bind RStickUp    kickem
wait 3; bind RStickDown  reloader
